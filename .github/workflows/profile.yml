name: Update profile

on:
  schedule:
    - cron: "0 0 * * *" # every day, 09:00 KST
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&custom_title=Extransload%27s%20GitHub%20Stats&bg_color=0D1117&title_color=A78BFA&icon_color=2CB1BC&text_color=C9D1D9&border_color=30363D
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=cql,css,html,makefile,shell,plsql,plpgsql,tsql&bg_color=0D1117&title_color=A78BFA&text_color=C9D1D9&border_color=30363D
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "Update profile cards" || exit 0
          git push
